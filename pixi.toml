[workspace]
authors = ["Alvaro Gaona <alvgaona@gmail.com>"]
channels = ["conda-forge"]
name = "livox-ros"
platforms = ["osx-arm64", "linux-64", "linux-aarch64"]
version = "0.1.0"

[tasks]
clean = "rm -rf build/ install/ log/"
clean-pkg = "sh -c 'rm -rf build/\"$0\" install/\"$0\"'"
build = "sh -c 'export CMAKE_PREFIX_PATH=\"$PWD/install/livox_sdk2:$PWD/install:${CMAKE_PREFIX_PATH:-$CONDA_PREFIX}\" LIBRARY_PATH=\"$CONDA_PREFIX/lib${LIBRARY_PATH:+:$LIBRARY_PATH}\" LDFLAGS=\"-L$CONDA_PREFIX/lib ${LDFLAGS:-}\" && colcon build --symlink-install --event-handlers console_direct+ --cmake-args -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DCMAKE_CXX_FLAGS=\"-Wall\" -DPython3_EXECUTABLE=$(which python) -DPython_EXECUTABLE=$(which python) -DPython3_ROOT_DIR=$CONDA_PREFIX -DPython3_FIND_STRATEGY=LOCATION -DCMAKE_EXE_LINKER_FLAGS=-L$CONDA_PREFIX/lib -DCMAKE_SHARED_LINKER_FLAGS=-L$CONDA_PREFIX/lib -DCMAKE_MODULE_LINKER_FLAGS=-L$CONDA_PREFIX/lib'"
build-pkg = "sh -c 'export CMAKE_PREFIX_PATH=\"$PWD/install/livox_sdk2:$PWD/install:${CMAKE_PREFIX_PATH:-$CONDA_PREFIX}\" LIBRARY_PATH=\"$CONDA_PREFIX/lib${LIBRARY_PATH:+:$LIBRARY_PATH}\" LDFLAGS=\"-L$CONDA_PREFIX/lib ${LDFLAGS:-}\" && colcon build --packages-up-to \"$0\" --symlink-install --event-handlers console_direct+ --cmake-args -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DCMAKE_CXX_FLAGS=\"-Wall\" -DPython3_EXECUTABLE=$(which python) -DPython_EXECUTABLE=$(which python) -DPython3_ROOT_DIR=$CONDA_PREFIX -DPython3_FIND_STRATEGY=LOCATION -DCMAKE_EXE_LINKER_FLAGS=-L$CONDA_PREFIX/lib -DCMAKE_SHARED_LINKER_FLAGS=-L$CONDA_PREFIX/lib -DCMAKE_MODULE_LINKER_FLAGS=-L$CONDA_PREFIX/lib'"
test-pkg = "sh -c 'colcon test --packages-up-to \"$0\" --event-handlers console_direct+'"
livox = "ros2 launch livox_ros livox.launch.py"

[dependencies]
pkg-config = ">=0.29.2,<0.30"
cmake = ">=4.2.1,<5"
ninja = ">=1.13.2,<2"
colcon-common-extensions = ">=0.3.0,<0.4"

[feature.humble]
channels = ["robostack-humble"]

[feature.humble.dependencies]
ros-humble-desktop = ">=0.10.0,<0.11"
ros-humble-ament-cmake-auto = ">=1.3.12,<2"

[feature.jazzy]
channels = ["robostack-jazzy"]

[feature.jazzy.dependencies]
ros-jazzy-desktop = ">=0.11.0,<0.12"
ros-jazzy-ament-cmake-auto = ">=2.5.4,<3"

[environments]
jazzy = ["jazzy"]
default = ["humble"]

[activation]
scripts = ["install/setup.bash"]
